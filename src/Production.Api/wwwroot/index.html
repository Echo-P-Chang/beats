<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beats Production Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #627086;
      --line: #d9e0ea;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --accent-soft: #dff7f3;
      --warn: #9a3412;
      --ok: #166534;
      --shadow: 0 12px 30px rgba(24, 33, 47, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.7rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .link-button,
    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 16px 18px;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }

    form,
    .panel-body {
      padding: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    textarea {
      min-height: 148px;
      resize: vertical;
    }

    .field {
      margin-bottom: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      padding: 4px 10px;
      font-size: 0.83rem;
      font-weight: 700;
    }

    .status-pill.ok {
      background: #dcfce7;
      color: var(--ok);
    }

    .status-pill.warn {
      background: #ffedd5;
      color: var(--warn);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 0.94rem;
    }

    .timeline {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .step {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      color: var(--muted);
    }

    .dot {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .step.done {
      color: var(--ink);
    }

    .step.done .dot {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .step-title {
      font-weight: 800;
    }

    .step-role {
      margin-top: 2px;
      font-size: 0.82rem;
    }

    .lookup {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .lookup input {
      min-width: 0;
    }

    .message {
      min-height: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      color: #b91c1c;
      font-weight: 700;
    }

	    .empty {
	      border: 1px dashed var(--line);
	      border-radius: 8px;
	      color: var(--muted);
	      padding: 18px;
	      text-align: center;
	    }

	    .flow-layout {
	      display: grid;
	      grid-template-columns: minmax(0, 1fr);
	      gap: 18px;
	      align-items: start;
	      margin-top: 18px;
	    }

	    .code-view {
	      min-height: 320px;
	      max-height: 460px;
	      margin: 0;
	      overflow: auto;
	      border-radius: 0 0 8px 8px;
	      background: #101827;
	      color: #e6edf7;
	      padding: 18px;
	      font: 0.83rem/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
	      white-space: pre;
	      tab-size: 2;
	    }

	    .diagram-wrap {
	      overflow-x: auto;
	      padding: 12px 12px 16px;
	    }

	    .flow-svg {
	      display: block;
	      width: 100%;
	      min-width: 920px;
	      height: auto;
	    }

	    .flow-node {
	      fill: #ffffff;
	      stroke: #cfd8e6;
	      stroke-width: 1.5;
	      filter: drop-shadow(0 8px 12px rgba(24, 33, 47, 0.08));
	    }

	    .flow-node.api {
	      stroke: #0f766e;
	    }

	    .flow-node.agent {
	      stroke: #2563eb;
	    }

	    .flow-node.done {
	      fill: #f0fdfa;
	      stroke: #0f766e;
	    }

	    .flow-node.active {
	      stroke: #0f766e;
	      stroke-width: 3;
	    }

	    .flow-bus {
	      fill: #f8fafc;
	      stroke: #cfd8e6;
	      stroke-width: 1.5;
	    }

		    .flow-line {
		      fill: none;
		      stroke: #0f766e;
		      stroke-width: 4;
		      stroke-linecap: round;
		      stroke-linejoin: round;
		      stroke-dasharray: 9 8;
		      animation: pulse-line 0.95s linear infinite;
		      opacity: 1;
		    }

	    .flow-label {
	      fill: #334155;
	      font-size: 12px;
	      font-weight: 700;
	    }

	    .flow-event-tag {
	      fill: #ffffff;
	      stroke: #d4dde9;
	      stroke-width: 1;
	    }

	    .flow-small {
	      fill: #64748b;
	      font-size: 11px;
	      font-weight: 700;
	    }

	    .flow-title {
	      fill: #18212f;
	      font-size: 14px;
	      font-weight: 800;
	    }

	    .flow-bus-title {
	      fill: #0f766e;
	      font-size: 15px;
	      font-weight: 900;
	    }

	    .flow-bus-label-bg {
	      fill: #f8fafc;
	    }

	    @keyframes pulse-line {
	      from {
	        stroke-dashoffset: 34;
	      }

	      to {
	        stroke-dashoffset: 0;
	      }
	    }

	    @media (max-width: 860px) {
	      .topbar,
	      .layout,
	      .flow-layout {
	        grid-template-columns: 1fr;
	      }

      .topbar {
        align-items: flex-start;
      }

      .links {
        justify-content: flex-start;
      }
    }

    @media (max-width: 560px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .grid-2,
      .result-grid {
        grid-template-columns: 1fr;
      }

	      .lookup {
	        flex-direction: column;
	      }

	      .code-view {
	        min-height: 300px;
	      }

	      .link-button,
	      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar" aria-labelledby="page-title">
      <div class="brand">
        <div class="mark" aria-hidden="true">B</div>
        <div>
          <h1 id="page-title">Beats Production Console</h1>
          <p class="subtitle">Choreography pipeline monitor</p>
        </div>
      </div>
      <nav class="links" aria-label="Runtime links">
        <a class="link-button" href="/health" target="_blank" rel="noreferrer">Health</a>
        <a class="link-button" href="http://localhost:15672" target="_blank" rel="noreferrer">RabbitMQ</a>
      </nav>
    </section>

    <section class="layout">
      <section class="panel" aria-labelledby="create-title">
        <div class="panel-header">
          <h2 id="create-title">New Production</h2>
          <span class="status-pill">API Ready</span>
        </div>
        <form id="production-form">
          <div class="field">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" required>請說一則800字的故事，並產出影片。</textarea>
          </div>
          <div class="field">
            <label for="style">Style</label>
            <input id="style" name="style" value="水彩繪本風" autocomplete="off">
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="targetWordCount">Target Words</label>
              <input id="targetWordCount" name="targetWordCount" type="number" min="100" max="3000" step="50" value="800">
            </div>
            <div class="field">
              <label for="durationSeconds">Duration Seconds</label>
              <input id="durationSeconds" name="durationSeconds" type="number" min="10" max="600" step="5" value="90">
            </div>
          </div>
          <div class="actions">
            <button class="primary" type="submit" id="start-button">Start Production</button>
            <button type="button" id="reset-button">Reset</button>
          </div>
          <p class="message" id="form-message" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="status-title">
        <div class="panel-header">
          <h2 id="status-title">Production Status</h2>
          <span class="status-pill" id="status-pill">Idle</span>
        </div>
        <div class="panel-body">
          <div id="status-content" class="empty">No production selected.</div>

          <div class="lookup">
            <input id="lookup-id" autocomplete="off" placeholder="production id">
            <button type="button" id="lookup-button">Lookup</button>
          </div>
        </div>
	      </section>
		    </section>

		    <section class="flow-layout" aria-label="Production flow">
		      <section class="panel" aria-labelledby="flow-diagram-title">
		        <div class="panel-header">
		          <h2 id="flow-diagram-title">Flow Architecture</h2>
		          <span class="status-pill" id="flow-diagram-pill">Loading</span>
		        </div>
		        <div id="flow-diagram" class="diagram-wrap">
		          <div class="empty">Loading flow diagram...</div>
		        </div>
		      </section>

		      <section class="panel" aria-labelledby="flow-config-title">
		        <div class="panel-header">
		          <h2 id="flow-config-title">production-flow.json</h2>
		          <span class="status-pill" id="flow-config-pill">Loading</span>
		        </div>
		        <pre id="flow-config" class="code-view">Loading flow config...</pre>
		      </section>
		    </section>
	  </main>

  <script>
    const finalStatuses = new Set(["ReviewPassed", "ReviewFailed"]);
    const steps = [
      ["ProductionRequested", "Production API"],
      ["StoryCreated", "Storyteller"],
      ["SceneImagesCreated", "Illustrator"],
      ["SceneAnimationsCreated", "Animator"],
      ["FinalVideoCreated", "Editor"],
      ["ReviewPassed", "Reviewer"]
    ];

    const form = document.querySelector("#production-form");
    const startButton = document.querySelector("#start-button");
    const resetButton = document.querySelector("#reset-button");
    const formMessage = document.querySelector("#form-message");
    const statusPill = document.querySelector("#status-pill");
	    const statusContent = document.querySelector("#status-content");
	    const lookupInput = document.querySelector("#lookup-id");
	    const lookupButton = document.querySelector("#lookup-button");
	    const flowConfig = document.querySelector("#flow-config");
	    const flowConfigPill = document.querySelector("#flow-config-pill");
	    const flowDiagram = document.querySelector("#flow-diagram");
	    const flowDiagramPill = document.querySelector("#flow-diagram-pill");

		    let pollHandle = 0;
		    let activeProductionId = "";
		    let currentFlow = null;
		    let flowPulseHandle = 0;
		    let lastFlowEvents = [];
		    const eventPulseWindowMs = 2000;
		    const eventPulseExpirations = new Map();

		    loadFlowConfig();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("Starting production...");
      startButton.disabled = true;

      try {
        const data = formData();
        const response = await fetch("/productions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

	        const result = await response.json();
	        activeProductionId = result.productionId;
	        resetFlowPulses();
	        lookupInput.value = activeProductionId;
	        renderPending(result);
	        setMessage("Production requested.");
	        poll(activeProductionId);
      } catch (error) {
        setMessage(error.message || "Request failed.", true);
      } finally {
        startButton.disabled = false;
      }
    });

    resetButton.addEventListener("click", () => {
      form.reset();
      clearInterval(pollHandle);
      pollHandle = 0;
	      activeProductionId = "";
	      resetFlowPulses();
	      lookupInput.value = "";
      statusPill.className = "status-pill";
      statusPill.textContent = "Idle";
      statusContent.className = "empty";
      statusContent.textContent = "No production selected.";
      setMessage("");
    });

    lookupButton.addEventListener("click", () => {
	      const id = lookupInput.value.trim();
      if (!id) {
        setMessage("Production id is required.", true);
        return;
      }

	      activeProductionId = id;
	      resetFlowPulses();
	      fetchStatus(id);
	    });

    function formData() {
      const targetWordCount = Number(document.querySelector("#targetWordCount").value || 800);
      const durationValue = document.querySelector("#durationSeconds").value;

      return {
        prompt: document.querySelector("#prompt").value.trim(),
        style: document.querySelector("#style").value.trim() || null,
        targetWordCount,
        durationSeconds: durationValue ? Number(durationValue) : null
      };
    }

	    function renderPending(result) {
	      renderStatus({
	        productionId: result.productionId,
	        status: result.status,
        prompt: formData().prompt,
        style: formData().style,
        targetWordCount: formData().targetWordCount,
        durationSeconds: formData().durationSeconds,
        createdAt: new Date().toISOString(),
	        updatedAt: new Date().toISOString()
	      }, [{
	        eventId: result.eventId,
	        productionId: result.productionId,
	        eventType: "ProductionRequested",
	        producer: "production-api",
	        createdAt: new Date().toISOString()
	      }]);
	    }

    async function fetchStatus(id) {
      try {
        const response = await fetch(`/productions/${encodeURIComponent(id)}`);

        if (response.status === 404) {
          throw new Error("Production not found.");
        }

        if (!response.ok) {
          throw new Error(await response.text());
        }

	        const production = await response.json();
	        const events = await fetchProductionEvents(id);
	        renderStatus(production, events);
	        setMessage("");

        if (!finalStatuses.has(production.status)) {
          poll(id);
        }
      } catch (error) {
        clearInterval(pollHandle);
        pollHandle = 0;
        setMessage(error.message || "Status lookup failed.", true);
      }
    }

    function poll(id) {
      clearInterval(pollHandle);
      pollHandle = window.setInterval(() => fetchStatus(id), 1800);
	      fetchStatus(id);
	    }

	    async function fetchProductionEvents(id) {
	      const response = await fetch(`/productions/${encodeURIComponent(id)}/events`);

	      if (!response.ok) {
	        throw new Error(await response.text());
	      }

	      return await response.json();
	    }

		    function renderStatus(production, events = []) {
		      const status = production.status || "Requested";
		      const stepIndex = statusToStepIndex(status);
		      const isFinal = finalStatuses.has(status);
		      const eventTypes = new Set(events.map((event) => event.eventType));
		      const hasEvents = events.length > 0;
		      rememberFlowEvents(events);

		      if (isFinal) {
        clearInterval(pollHandle);
        pollHandle = 0;
      }

      statusPill.textContent = status;
      statusPill.className = `status-pill ${isFinal ? "ok" : "warn"}`;

      statusContent.className = "";
      statusContent.innerHTML = `
        <div class="result-grid">
          ${metric("Production ID", production.productionId)}
          ${metric("Status", status)}
          ${metric("Style", production.style || "-")}
          ${metric("Updated", formatTime(production.updatedAt))}
        </div>
        <div class="metric">
          <span>Prompt</span>
          <strong>${escapeHtml(production.prompt || "-")}</strong>
	        </div>
	        <div class="timeline">
	          ${steps.map((step, index) => renderStep(
	            step,
	            hasEvents ? eventTypes.has(step[0]) : index <= stepIndex,
	            events.find((event) => event.eventType === step[0]))).join("")}
	        </div>
	      `;

		      if (currentFlow) {
		        flowDiagram.innerHTML = renderFlowDiagram(currentFlow, events);
		        scheduleFlowPulseExpiry();
		      }
		    }

		    function rememberFlowEvents(events) {
		      lastFlowEvents = events;
		      const now = Date.now();

		      for (const event of events) {
		        const key = eventKey(event);
		        if (!eventPulseExpirations.has(key)) {
		          eventPulseExpirations.set(key, now + eventPulseWindowMs);
		        }
		      }
		    }

		    function visiblePulseEvents(events) {
		      const now = Date.now();

		      return events.filter((event) => (eventPulseExpirations.get(eventKey(event)) ?? 0) > now);
		    }

		    function scheduleFlowPulseExpiry() {
		      clearTimeout(flowPulseHandle);

		      const expirations = lastFlowEvents
		        .map((event) => eventPulseExpirations.get(eventKey(event)) ?? 0)
		        .filter((expiresAt) => expiresAt > Date.now());

		      if (expirations.length === 0) {
		        return;
		      }

		      const nextExpiration = Math.min(...expirations);
		      flowPulseHandle = window.setTimeout(() => {
		        if (currentFlow) {
		          flowDiagram.innerHTML = renderFlowDiagram(currentFlow, lastFlowEvents);
		          scheduleFlowPulseExpiry();
		        }
		      }, Math.max(0, nextExpiration - Date.now()) + 40);
		    }

		    function resetFlowPulses() {
		      clearTimeout(flowPulseHandle);
		      flowPulseHandle = 0;
		      lastFlowEvents = [];
		      eventPulseExpirations.clear();

		      if (currentFlow) {
		        flowDiagram.innerHTML = renderFlowDiagram(currentFlow, []);
		      }
		    }

		    function eventKey(event) {
		      return event.eventId || `${event.productionId}:${event.eventType}:${event.createdAt}`;
		    }

	    function metric(label, value) {
      return `
        <div class="metric">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value ?? "-")}</strong>
        </div>
      `;
    }

	    function renderStep(step, done, event) {
	      return `
	        <div class="step ${done ? "done" : ""}">
	          <div class="dot">${done ? "✓" : "-"}</div>
	          <div>
	            <div class="step-title">${escapeHtml(step[0])}</div>
	            <div class="step-role">${escapeHtml(event ? `${step[1]} · ${formatTime(event.createdAt)}` : step[1])}</div>
	          </div>
	        </div>
	      `;
    }

	    function statusToStepIndex(status) {
	      const map = {
        Requested: 0,
        ProductionRequested: 0,
        StoryCreated: 1,
        ImagesCreated: 2,
        SceneImagesCreated: 2,
        AnimationsCreated: 3,
        SceneAnimationsCreated: 3,
        FinalVideoCreated: 4,
        ReviewPassed: 5,
        ReviewFailed: 5
      };

	      return map[status] ?? 0;
	    }

	    async function loadFlowConfig() {
	      try {
	        const response = await fetch("/production-flow");

	        if (!response.ok) {
	          throw new Error(await response.text());
	        }

	        const text = await response.text();
	        const flow = JSON.parse(text);
	        currentFlow = flow;
	        flowConfig.textContent = JSON.stringify(flow, null, 2);
	        flowConfigPill.textContent = "Loaded";
	        flowConfigPill.className = "status-pill ok";
	        flowDiagram.innerHTML = renderFlowDiagram(flow, []);
	        flowDiagramPill.textContent = "Live Config";
	        flowDiagramPill.className = "status-pill ok";
	      } catch (error) {
	        flowConfig.textContent = error.message || "Flow config load failed.";
	        flowConfigPill.textContent = "Error";
	        flowConfigPill.className = "status-pill warn";
	        flowDiagram.innerHTML = `<div class="empty error">${escapeHtml(error.message || "Flow diagram load failed.")}</div>`;
	        flowDiagramPill.textContent = "Error";
	        flowDiagramPill.className = "status-pill warn";
	      }
	    }

	    function renderFlowDiagram(flow, events = []) {
	      const agentFlows = Array.isArray(flow.agentFlows) ? flow.agentFlows : [];
	      const nodes = deriveFlowNodes(agentFlows);
	      const pulseEvents = visiblePulseEvents(events);
	      const pulseTypes = new Set(pulseEvents.map((event) => event.eventType));
	      const activeProducer = pulseEvents.at(-1)?.producer || "";

	      if (nodes.length === 0) {
	        return `<div class="empty">No flow nodes found.</div>`;
	      }

	      const width = Math.max(920, nodes.length * 156);
	      const height = 360;
	      const margin = 76;
	      const nodeWidth = 128;
	      const nodeHeight = 62;
	      const nodeY = 42;
	      const busTop = 168;
	      const busHeight = 92;
	      const busLaneY = busTop + 66;
	      const nodeGap = nodes.length === 1 ? 0 : (width - margin * 2) / (nodes.length - 1);
	      const nodeX = new Map(nodes.map((node, index) => [node.agentRole, margin + nodeGap * index]));

	      const edges = agentFlows.flatMap((producer) =>
	        (producer.publications || []).flatMap((publication) => {
	          const subscribers = subscribersFor(agentFlows, publication.eventType);

	          return subscribers.length > 0
	            ? subscribers.map((subscriber) => ({ producer, subscriber, publication }))
	            : [{ producer, subscriber: null, publication }];
	        })
	      );

	      const nodeMarkup = nodes.map((node) => {
	        const cx = nodeX.get(node.agentRole);
	        const x = cx - nodeWidth / 2;
	        const roleClass = node.agentRole === "production-api" ? "api" : "agent";
	        const nodeDone = events.some((event) => event.producer === node.agentRole);
	        const nodeActive = activeProducer === node.agentRole;
	        return `
	          <g>
	            <rect class="flow-node ${roleClass} ${nodeDone ? "done" : ""} ${nodeActive ? "active" : ""}" x="${x}" y="${nodeY}" width="${nodeWidth}" height="${nodeHeight}" rx="8"></rect>
	            <text class="flow-title" x="${cx}" y="${nodeY + 26}" text-anchor="middle">${escapeHtml(roleTitle(node.agentRole))}</text>
	            <text class="flow-small" x="${cx}" y="${nodeY + 45}" text-anchor="middle">${escapeHtml(node.agentRole)}</text>
	          </g>
	        `;
	      }).join("");

	      const edgeMarkup = edges.map((edge, index) => {
	        if (!pulseTypes.has(edge.publication.eventType)) {
	          return "";
	        }

	        const sx = nodeX.get(edge.producer.agentRole);
	        const tx = edge.subscriber ? nodeX.get(edge.subscriber.agentRole) : undefined;

	        if (sx === undefined) {
	          return "";
	        }

	        const startY = nodeY + nodeHeight;
	        const endY = nodeY + nodeHeight;
	        const midX = tx === undefined ? sx : (sx + tx) / 2;
	        const labelY = busTop + busHeight + 26 + (index % 2) * 22;
	        const labelWidth = Math.max(128, edge.publication.eventType.length * 8 + 24);
	        const path = tx === undefined
	          ? [
	              `M ${sx} ${startY}`,
	              `C ${sx} ${startY + 46}, ${sx} ${busLaneY - 30}, ${sx} ${busLaneY}`
	            ].join(" ")
	          : [
	              `M ${sx} ${startY}`,
	              `C ${sx} ${startY + 46}, ${sx} ${busLaneY - 30}, ${sx} ${busLaneY}`,
	              `L ${tx} ${busLaneY}`,
	              `C ${tx} ${busLaneY - 30}, ${tx} ${endY + 46}, ${tx} ${endY}`
	            ].join(" ");

	        return `
	          <path class="flow-line active" d="${path}" marker-end="url(#arrow)" style="animation-delay: -${index * 0.2}s"></path>
	          <rect class="flow-event-tag" x="${midX - labelWidth / 2}" y="${labelY - 16}" width="${labelWidth}" height="24" rx="6"></rect>
	          <text class="flow-label" x="${midX}" y="${labelY}" text-anchor="middle">${escapeHtml(edge.publication.eventType)}</text>
	        `;
	      }).join("");

	      return `
	        <svg class="flow-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Production choreography architecture">
	          <defs>
	            <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
	              <path d="M0,0 L0,6 L8,3 z" fill="#0f766e"></path>
	            </marker>
	          </defs>
	          <rect class="flow-bus" x="44" y="${busTop}" width="${width - 88}" height="${busHeight}" rx="8"></rect>
	          ${edgeMarkup}
	          <rect class="flow-bus-label-bg" x="${width / 2 - 245}" y="${busTop + 13}" width="490" height="44" rx="8"></rect>
	          <text class="flow-bus-title" x="${width / 2}" y="${busTop + 28}" text-anchor="middle">RabbitMQ Event Bus</text>
	          <text class="flow-small" x="${width / 2}" y="${busTop + 50}" text-anchor="middle">pub-sub exchanges, queues, and consumer endpoints</text>
	          ${nodeMarkup}
	        </svg>
	      `;
	    }

	    function deriveFlowNodes(agentFlows) {
	      const byRole = new Map(agentFlows.map((flow) => [flow.agentRole, flow]));
	      const nodes = [];
	      const visited = new Set();

	      let current = byRole.get("production-api") || agentFlows.find((flow) => (flow.subscriptions || []).length === 0);

	      while (current && !visited.has(current.agentRole)) {
	        nodes.push(current);
	        visited.add(current.agentRole);

	        const nextPublication = (current.publications || []).find((publication) =>
	          subscribersFor(agentFlows, publication.eventType).some((subscriber) => !visited.has(subscriber.agentRole)));

	        current = nextPublication
	          ? subscribersFor(agentFlows, nextPublication.eventType).find((subscriber) => !visited.has(subscriber.agentRole))
	          : null;
	      }

	      for (const flow of agentFlows) {
	        if (!visited.has(flow.agentRole)) {
	          nodes.push(flow);
	        }
	      }

	      return nodes;
	    }

	    function subscribersFor(agentFlows, eventType) {
	      return agentFlows.filter((flow) =>
	        (flow.subscriptions || []).some((subscription) => subscription.eventType === eventType));
	    }

	    function roleTitle(agentRole) {
	      const titles = {
	        "production-api": "Production API",
	        "storyteller-agent": "Storyteller",
	        "illustrator-agent": "Illustrator",
	        "animator-agent": "Animator",
	        "editor-agent": "Editor",
	        "reviewer-agent": "Reviewer"
	      };

	      return titles[agentRole] || agentRole;
	    }

	    function formatTime(value) {
      if (!value) {
        return "-";
      }

      return new Intl.DateTimeFormat("zh-Hant", {
        dateStyle: "short",
        timeStyle: "medium"
      }).format(new Date(value));
    }

    function setMessage(message, isError = false) {
      formMessage.textContent = message;
      formMessage.className = isError ? "message error" : "message";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
