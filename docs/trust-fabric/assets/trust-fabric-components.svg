<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">AI Trust Fabric architecture components</title>
  <desc id="description">An interactive layered walkthrough of the nine architecture components in chapter six: application registry, four enforcement gateways, policy decision point, approval service, evaluation and release gate, and audit evidence plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .eyebrow { fill: #0f766e; font-size: 15px; font-weight: 750; }
      .heading { fill: #172033; font-size: 30px; font-weight: 780; }
      .subheading { fill: #64748b; font-size: 16px; }
      .plane-label { fill: #475569; font-size: 13px; font-weight: 800; }
      .plane-note { fill: #64748b; font-size: 12px; }
      .app-title { fill: #172033; font-size: 17px; font-weight: 740; }
      .app-note { fill: #64748b; font-size: 13px; }
      .card-title { fill: #172033; font-size: 19px; font-weight: 760; }
      .card-note { fill: #64748b; font-size: 13px; }
      .card-tag { fill: #0f766e; font-size: 11px; font-weight: 800; }
      .target-text { fill: #475569; font-size: 12px; font-weight: 700; }
      .audit-title { fill: #172033; font-size: 20px; font-weight: 780; }
      .audit-note { fill: #475569; font-size: 14px; }
      .component { opacity: 1; transition: opacity .28s ease; }
      .component .focus-ring { opacity: 0; transition: opacity .28s ease; }
      .sequence-number { fill: #94a3b8; }
      .sequence-text { fill: #ffffff; font-size: 12px; font-weight: 800; text-anchor: middle; }
      .interactive .component { opacity: .2; cursor: pointer; }
      .interactive .component.is-complete { opacity: .58; }
      .interactive .component.is-active { opacity: 1; }
      .interactive .component.is-active .focus-ring,
      .interactive .component:focus .focus-ring { opacity: 1; }
      .flow-line { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .flow-line-accent { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 7 9; marker-end: url(#arrow-accent); }
      .evidence-line { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 5 8; opacity: .6; }
      @media (prefers-reduced-motion: reduce) {
        .component, .component .focus-ring { animation: none; transition: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="24" y="24" width="1552" height="852" rx="8" fill="#ffffff" stroke="#dbe3ec" stroke-width="2"/>

  <text class="eyebrow" x="66" y="66">CHAPTER 6 · ARCHITECTURE COMPONENTS</text>
  <text class="heading" x="66" y="104">Govern every AI trust boundary</text>
  <text class="subheading" x="66" y="133">Common control contracts surround independent AI implementations.</text>
  <g transform="translate(1300 54)">
    <rect width="230" height="54" rx="7" fill="#f7f9fc" stroke="#dbe3ec"/>
    <circle class="pulse" cx="24" cy="27" r="6" fill="#16a34a"/>
    <text x="40" y="24" fill="#172033" font-size="12" font-weight="750">INTERACTIVE WALKTHROUGH</text>
    <text x="40" y="41" fill="#64748b" font-size="11">9 components · choose a step</text>
  </g>

  <text class="plane-label" x="66" y="183">APPLICATION PLANE</text>
  <text class="plane-note" x="220" y="183">framework-neutral workloads</text>
  <rect x="66" y="198" width="1468" height="92" rx="8" fill="#f7f9fc" stroke="#dbe3ec"/>
  <g transform="translate(96 220)">
    <rect width="235" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#2563eb"/>
    <text class="app-title" x="25" y="22">ML services</text>
    <text class="app-note" x="25" y="39">predict · classify</text>
  </g>
  <g transform="translate(365 220)">
    <rect width="235" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#0f766e"/>
    <text class="app-title" x="25" y="22">RAG applications</text>
    <text class="app-note" x="25" y="39">retrieve · ground</text>
  </g>
  <g transform="translate(634 220)">
    <rect width="235" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#7c3aed"/>
    <text class="app-title" x="25" y="22">AI agents</text>
    <text class="app-note" x="25" y="39">plan · delegate · act</text>
  </g>
  <g transform="translate(903 220)">
    <rect width="235" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#d97706"/>
    <text class="app-title" x="25" y="22">AI-enabled APIs</text>
    <text class="app-note" x="25" y="39">assist · automate</text>
  </g>
  <g transform="translate(1172 220)">
    <rect width="332" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#dc2626"/>
    <text class="app-title" x="25" y="22">Third-party AI SaaS</text>
    <text class="app-note" x="25" y="39">registered external capability</text>
  </g>

  <text class="plane-label" x="66" y="332">POLICY ENFORCEMENT PLANE</text>
  <text class="plane-note" x="274" y="332">intercept before data leaves or effects occur</text>

  <path class="flow-line" d="M237 290 V354"/>
  <path class="flow-line" d="M612 290 V354"/>
  <path class="flow-line" d="M987 290 V354"/>
  <path class="flow-line" d="M1362 290 V354"/>

  <g class="component c2" data-step="2" transform="translate(66 354)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="142" rx="8" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect width="342" height="130" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">02</text>
    <text class="card-tag" x="55" y="31">MODEL BOUNDARY</text>
    <text class="card-title" x="22" y="67">AI Gateway</text>
    <text class="card-note" x="22" y="91">Provider · model · region · safety</text>
    <text class="card-note" x="22" y="112">Token, quota, cost and trace limits</text>
  </g>
  <g class="component c3" data-step="3" transform="translate(441 354)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="142" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect width="342" height="130" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">03</text>
    <text class="card-tag" x="55" y="31">DATA BOUNDARY</text>
    <text class="card-title" x="22" y="67">Retrieval &amp; Data Gateway</text>
    <text class="card-note" x="22" y="91">ACL · masking · purpose limitation</text>
    <text class="card-note" x="22" y="112">Source version, citation and provenance</text>
  </g>
  <g class="component c4" data-step="4" transform="translate(816 354)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="142" rx="8" fill="none" stroke="#d97706" stroke-width="3"/>
    <rect width="342" height="130" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">04</text>
    <text class="card-tag" x="55" y="31">EFFECT BOUNDARY</text>
    <text class="card-title" x="22" y="67">Tool &amp; Action Gateway</text>
    <text class="card-note" x="22" y="91">Schema · scope · limits · idempotency</text>
    <text class="card-note" x="22" y="112">Approval before consequential writes</text>
  </g>
  <g class="component c5" data-step="5" transform="translate(1191 354)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="142" rx="8" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <rect width="342" height="130" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">05</text>
    <text class="card-tag" x="55" y="31">DELEGATION BOUNDARY</text>
    <text class="card-title" x="22" y="67">Agent Interaction Gateway</text>
    <text class="card-note" x="22" y="91">Peer identity · scope · hop budget</text>
    <text class="card-note" x="22" y="112">Fan-out, recursion and transfer policy</text>
  </g>

  <g transform="translate(114 500)"><rect width="246" height="34" rx="7" fill="#f7f9fc" stroke="#dbe3ec"/><text class="target-text" x="123" y="22" text-anchor="middle">APPROVED MODELS</text></g>
  <g transform="translate(489 500)"><rect width="246" height="34" rx="7" fill="#f7f9fc" stroke="#dbe3ec"/><text class="target-text" x="123" y="22" text-anchor="middle">GOVERNED DATA</text></g>
  <g transform="translate(864 500)"><rect width="246" height="34" rx="7" fill="#f7f9fc" stroke="#dbe3ec"/><text class="target-text" x="123" y="22" text-anchor="middle">TOOLS &amp; BUSINESS APIs</text></g>
  <g transform="translate(1239 500)"><rect width="246" height="34" rx="7" fill="#f7f9fc" stroke="#dbe3ec"/><text class="target-text" x="123" y="22" text-anchor="middle">TRUSTED PEER AGENTS</text></g>

  <path class="flow-line-accent" d="M237 484 V500"/>
  <path class="flow-line-accent" d="M612 484 V500"/>
  <path class="flow-line-accent" d="M987 484 V500"/>
  <path class="flow-line-accent" d="M1362 484 V500"/>

  <text class="plane-label" x="66" y="584">GOVERNANCE CONTROL PLANE</text>
  <text class="plane-note" x="300" y="584">registered intent becomes enforceable decisions</text>

  <path class="evidence-line" d="M237 484 V752"/>
  <path class="evidence-line" d="M612 484 V752"/>
  <path class="evidence-line" d="M987 484 V752"/>
  <path class="evidence-line" d="M1362 484 V752"/>

  <path class="flow-line" d="M408 655 H441"/>
  <path class="flow-line" d="M783 655 H816"/>
  <path class="flow-line" d="M1158 655 H1191"/>

  <g class="component c1" data-step="1" transform="translate(66 600)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="122" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect width="342" height="110" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">01</text>
    <text class="card-title" x="55" y="33">AI Application Registry</text>
    <text class="card-note" x="22" y="67">Purpose · owners · risk · approved inventory</text>
    <text class="card-note" x="22" y="89">Immutable manifest and policy versions</text>
  </g>
  <g class="component c6" data-step="6" transform="translate(441 600)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="122" rx="8" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect width="342" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">06</text>
    <text class="card-title" x="55" y="33">Policy Decision Point</text>
    <text class="card-note" x="22" y="67">Allow · Deny · Approval · Obligations</text>
    <text class="card-note" x="22" y="89">Versioned, testable and explainable policy</text>
  </g>
  <g class="component c7" data-step="7" transform="translate(816 600)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="122" rx="8" fill="none" stroke="#d97706" stroke-width="3"/>
    <rect width="342" height="110" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">07</text>
    <text class="card-title" x="55" y="33">Approval Service</text>
    <text class="card-note" x="22" y="67">Human or dual-control decision</text>
    <text class="card-note" x="22" y="89">Bound to the exact normalized action</text>
  </g>
  <g class="component c8" data-step="8" transform="translate(1191 600)">
    <rect class="focus-ring" x="-6" y="-6" width="354" height="122" rx="8" fill="none" stroke="#dc2626" stroke-width="3"/>
    <rect width="342" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle class="sequence-number" cx="29" cy="27" r="16"/><text class="sequence-text" x="29" y="31">08</text>
    <text class="card-title" x="55" y="33">Evaluation &amp; Release Gate</text>
    <text class="card-note" x="22" y="67">Security, quality and policy tests</text>
    <text class="card-note" x="22" y="89">Signed authorization for exact versions</text>
  </g>

  <g class="component c9" data-step="9" transform="translate(66 752)">
    <rect class="focus-ring" x="-6" y="-6" width="1480" height="92" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect width="1468" height="80" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
    <circle class="sequence-number" cx="34" cy="40" r="17"/><text class="sequence-text" x="34" y="44">09</text>
    <text class="audit-title" x="68" y="35">Audit Evidence Plane</text>
    <text class="audit-note" x="68" y="58">Identity · delegation · policy decision · approval · model and tool calls · artifacts · outcomes</text>
    <g transform="translate(1120 20)">
      <rect width="310" height="40" rx="7" fill="#ffffff" stroke="#99f6e4"/>
      <text x="155" y="17" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="800">RECONSTRUCT EVERY MATERIAL EXECUTION</text>
      <text x="155" y="32" text-anchor="middle" fill="#64748b" font-size="10">privacy-aware · tamper-evident · retained</text>
    </g>
  </g>

  <text x="66" y="864" fill="#64748b" font-size="12">CONTROL CONTRACTS, NOT A MANDATORY AI FRAMEWORK</text>
  <text x="1534" y="864" fill="#94a3b8" font-size="11" text-anchor="end">AI Trust Fabric · Draft v0.1</text>
</svg>
